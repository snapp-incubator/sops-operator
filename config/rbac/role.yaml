---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - gitopssecret.snappcloud.io
  resources:
  - gpgkeys
  - sopssecrets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - gitopssecret.snappcloud.io
  resources:
  - gpgkeys/finalizers
  - sopssecrets/finalizers
  verbs:
  - update
- apiGroups:
  - gitopssecret.snappcloud.io
  resources:
  - gpgkeys/status
  - sopssecrets/status
  verbs:
  - get
  - patch
  - update
